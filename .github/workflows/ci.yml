# CI/CD for Pantry Chef.
#
# - Pull requests and pushes to main: run the test suite.
# - Push to main (or a manual run on main): if the tests pass, build the
#   Docker image and push it to GHCR as
#     ghcr.io/<owner>/pantry-chef:latest
#     ghcr.io/<owner>/pantry-chef:sha-<short commit sha>
# - Manual run on any other branch ("Run workflow" on the Actions tab, pick
#   the branch): same, but tagged with the branch name instead of latest,
#   so a branch can be tried on the server before it's merged:
#     ghcr.io/<owner>/pantry-chef:<branch, "/" becomes "-">  e.g. feature-cooked-it
#     ghcr.io/<owner>/pantry-chef:sha-<short commit sha>
#
# No secrets are needed: tests fake the Anthropic client, and pushing to GHCR
# uses the built-in GITHUB_TOKEN.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

# A newer push to the same branch cancels the older, still-running workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # same as the Docker image
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  build:
    needs: test
    # Publish on a push to main, or when someone runs the workflow by hand
    # (on any branch). Never from pull requests.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out the image tags, and adds OCI labels (including the source
      # repo, which links the GHCR package to this repository). `latest`
      # only ever comes from main; other branches get their name as the tag.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/pantry-chef
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse unchanged layers (e.g. the pip install) between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
